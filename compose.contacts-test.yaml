name: broadcast-contacts-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: broadcast_test
      MYSQL_USER: broadcast_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-root-test-only
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - contacts-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"
volumes:
  contacts-test-data:
