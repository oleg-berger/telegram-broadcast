name: telegram-broadcast

x-service: &service
  image: telegram-broadcast:local
  build:
    context: .
    target: production
  env_file: .env
  environment:
    DATABASE_PATH: /data/broadcast.sqlite
    ATTACHMENTS_PATH: /attachments
    ATTACHMENTS_LINK_KEY_FILE: /private-links/signing.key
  volumes:
    - bot-data:/data
    - attachments-data:/attachments
    - attachment-keys:/private-links
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  poll:
    <<: *service
    command: ["poll"]
  worker:
    <<: *service
    command: ["worker"]

volumes:
  bot-data:
  attachments-data:
  attachment-keys:
