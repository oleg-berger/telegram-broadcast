[global]
pid = /tmp/php-fpm.pid

[www]
user = bot
group = bot
listen = 9000
clear_env = yes
access.log = /dev/null
env[DATABASE_PATH] = $DATABASE_PATH
env[ATTACHMENTS_PATH] = $ATTACHMENTS_PATH
env[ATTACHMENTS_PUBLIC_BASE_URL] = $ATTACHMENTS_PUBLIC_BASE_URL
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
php_admin_value[expose_php] = off
