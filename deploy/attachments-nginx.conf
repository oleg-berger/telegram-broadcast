# Include inside the existing HTTPS server block after configuring its TLS certificate.
# For service.imenka.world with compose.attachments.yaml; the script path is inside FPM.
location ~ ^/download/([A-Za-z0-9_-]{43})$ {
    access_log off;
    error_log /dev/null;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/download.php;
    fastcgi_param QUERY_STRING token=$1;
    fastcgi_param REQUEST_URI /download;
    fastcgi_pass 127.0.0.1:9005;
    fastcgi_hide_header X-Powered-By;
}

location /download {
    access_log off;
    error_log /dev/null;
    return 404;
}
